name: CI/CD Pipeline for Security JK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  # 1. ПРОВЕРКА БЭКЕНДА
  backend-test:
    name: Проверка бэкенда
    runs-on: ubuntu-latest
    
    steps:
      - name: Клонирование репозитория
        uses: actions/checkout@v4
      
      - name: Установка Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Установка зависимостей
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Проверка синтаксиса Python
        run: |
          cd backend
          python -m py_compile app/main.py
          python -m py_compile app/auth.py
          python -m py_compile app/database.py
          python -m py_compile app/models.py
          python -m py_compile app/schemas.py
          echo "✅ Синтаксис Python корректен"
      
      - name: Проверка импорта модулей
        run: |
          cd backend
          python -c "from app.main import app; print('✅ Бэкенд загружен успешно')"
          python -c "from app.database import Base, engine; print('✅ База данных настроена')"
          python -c "from app.auth import create_access_token, get_password_hash; print('✅ JWT работает')"
          echo "✅ Все модули импортируются корректно"
      
      - name: Проверка наличия обязательных файлов
        run: |
          test -f backend/requirements.txt && echo "✅ requirements.txt найден"
          test -f backend/run.py && echo "✅ run.py найден"
          test -d backend/app && echo "✅ Папка app найдена"
          test -f backend/app/main.py && echo "✅ main.py найден"
          test -f backend/app/routes/auth.py && echo "✅ auth.py найден"

  # 2. ПРОВЕРКА ФРОНТЕНДА
  frontend-test:
    name: Проверка фронтенда
    runs-on: ubuntu-latest
    
    steps:
      - name: Клонирование репозитория
        uses: actions/checkout@v4
      
      - name: Установка Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      
      - name: Установка зависимостей
        run: |
          cd frontend
          npm install
      
      - name: Проверка сборки
        run: |
          cd frontend
          CI=false npm run build
          test -d build && echo "✅ Сборка успешна"
      
      - name: Проверка наличия обязательных файлов
        run: |
          test -f frontend/package.json && echo "✅ package.json найден"
          test -f frontend/public/index.html && echo "✅ index.html найден"
          test -d frontend/src && echo "✅ Папка src найдена"
          test -f frontend/src/App.js && echo "✅ App.js найден"

  # 3. ПРОВЕРКА БЕЗОПАСНОСТИ
  security-test:
    name: Проверка безопасности
    runs-on: ubuntu-latest
    
    steps:
      - name: Клонирование репозитория
        uses: actions/checkout@v4
      
      - name: Проверка секретных ключей
        run: |
          if grep -q "your-super-secret-key-change-in-production" backend/app/auth.py; then
            echo "⚠️ ВНИМАНИЕ: Используется стандартный секретный ключ!"
            echo "⚠️ Рекомендуется заменить на свой в продакшене"
          else
            echo "✅ Секретный ключ не стандартный"
          fi
      
      - name: Проверка безопасности паролей
        run: |
          if grep -q "password.*=.*\"" backend/app/database.py; then
            echo "⚠️ ВНИМАНИЕ: Пароль БД прописан в коде"
            echo "⚠️ Рекомендуется использовать переменные окружения"
          else
            echo "✅ Пароль не найден в коде"
          fi
      
      - name: Проверка CORS настроек
        run: |
          if grep -q "allow_origins.*=.*\[" backend/app/main.py; then
            echo "✅ CORS настроен"
          else
            echo "⚠️ CORS не настроен"
          fi
      
      - name: Проверка хэширования паролей
        run: |
          if grep -q "bcrypt\|sha256_crypt" backend/app/auth.py; then
            echo "✅ Хэширование паролей настроено"
          else
            echo "⚠️ Хэширование паролей не обнаружено"
          fi

  # 4. ПРОВЕРКА СТРУКТУРЫ
  structure-test:
    name: Проверка структуры проекта
    runs-on: ubuntu-latest
    
    steps:
      - name: Клонирование репозитория
        uses: actions/checkout@v4
      
      - name: Проверка структуры бэкенда
        run: |
          echo "Проверка структуры бэкенда:"
          ls -la backend/
          ls -la backend/app/
          ls -la backend/app/routes/
          
          # Проверяем наличие всех роутов
          test -f backend/app/routes/auth.py && echo "✅ auth.py"
          test -f backend/app/routes/passes.py && echo "✅ passes.py"
          test -f backend/app/routes/incidents.py && echo "✅ incidents.py"
      
      - name: Проверка структуры фронтенда
        run: |
          echo "Проверка структуры фронтенда:"
          ls -la frontend/
          ls -la frontend/src/
          ls -la frontend/src/pages/
          ls -la frontend/src/components/

  # 5. ИТОГОВЫЙ СТАТУС
  final-status:
    name: Итоговый статус проверки
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test, security-test, structure-test]
    if: always()
    
    steps:
      - name: Вывод результатов
        run: |
          echo "========================================="
          echo "📊 РЕЗУЛЬТАТЫ ПРОВЕРКИ CI/CD"
          echo "========================================="
          echo "  ✅ Бэкенд: ${{ needs.backend-test.result }}"
          echo "  ✅ Фронтенд: ${{ needs.frontend-test.result }}"
          echo "  ✅ Безопасность: ${{ needs.security-test.result }}"
          echo "  ✅ Структура: ${{ needs.structure-test.result }}"
          echo "========================================="
          
          if [[ "${{ needs.backend-test.result }}" == "success" && \
                "${{ needs.frontend-test.result }}" == "success" && \
                "${{ needs.structure-test.result }}" == "success" ]]; then
            echo "🎉 ВСЕ ПРОВЕРКИ ПРОЙДЕНЫ УСПЕШНО!"
            echo "✅ Проект готов к деплою"
          else
            echo "❌ НЕКОТОРЫЕ ПРОВЕРКИ НЕ ПРОЙДЕНЫ"
            echo "⚠️ Требуется исправление ошибок"
            exit 1
          fi
