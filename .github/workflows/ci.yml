name: CI/CD Pipeline for Security JK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-test:
    name: Проверка бэкенда
    runs-on: ubuntu-latest
    
    # Запускаем PostgreSQL как сервис
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: security_user
          POSTGRES_PASSWORD: SecurePass123
          POSTGRES_DB: security_jk
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --timeout 5s
          --retries 5
        ports:
          - 5432:5432
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Install dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pydantic[email] email-validator
      
      - name: Wait for PostgreSQL
        run: |
          for i in {1..30}; do
            if pg_isready -h localhost -p 5432 -U security_user; then
              echo "✅ PostgreSQL готов"
              exit 0
            fi
            echo "Ждем PostgreSQL..."
            sleep 2
          done
          echo "❌ PostgreSQL не запустился"
          exit 1
      
      - name: Test imports
        run: |
          cd backend
          python -c "
          import sys
          sys.path.insert(0, '.')
          from app.database import Base, engine
          from app.models import User, AccessPass, SecurityIncident
          from app.schemas import UserCreate, UserLogin, Token
          from app.auth import get_password_hash, verify_password
          from app.main import app
          print('✅ Все импорты успешны!')
          "
      
      - name: Create tables
        run: |
          cd backend
          python -c "
          from app.database import engine, Base
          from app.models import User, AccessPass, SecurityIncident
          Base.metadata.create_all(bind=engine)
          print('✅ Таблицы созданы')
          "

  frontend-test:
    name: Проверка фронтенда
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      
      - name: Install dependencies
        run: |
          cd frontend
          npm install --legacy-peer-deps
      
      - name: Build
        run: |
          cd frontend
          CI=false npm run build
          echo "✅ Сборка успешна"

  final-status:
    name: Итоговый статус
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test]
    if: always()
    
    steps:
      - run: |
          echo "========================================="
          echo "📊 РЕЗУЛЬТАТЫ ПРОВЕРКИ CI/CD"
          echo "========================================="
          echo "  Бэкенд: ${{ needs.backend-test.result }}"
          echo "  Фронтенд: ${{ needs.frontend-test.result }}"
          echo "========================================="
          
          if [[ "${{ needs.backend-test.result }}" == "success" && \
                "${{ needs.frontend-test.result }}" == "success" ]]; then
            echo "🎉 ВСЕ ПРОВЕРКИ ПРОЙДЕНЫ УСПЕШНО!"
            exit 0
          else
            echo "❌ НЕКОТОРЫЕ ПРОВЕРКИ НЕ ПРОЙДЕНЫ"
            exit 1
          fi
